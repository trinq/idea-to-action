[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idea-to-action"
version = "0.1.0"
description = "AI Personal Productivity Agent — turns raw notes into organized ideas, action plans, and approval-gated tool actions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Idea-to-Action Team"},
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
ui = ["streamlit>=1.40.0"]
google = [
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
]
notion = ["notion-client>=2.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/idea_to_action"]
